<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1360 420">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <rect class="box infra" x="120" y="142" width="150" height="58" rx="11"/><text class="t sm" x="195" y="166" text-anchor="middle">min-speed floor</text><text class="s" x="195" y="184" text-anchor="middle">sign-preserving</text>
    <circle cx="320" cy="171" r="20" fill="#fff" stroke="#475569" stroke-width="1.8" filter="url(#sh)"/><text class="s" x="298" y="158">+</text><text class="s" x="306" y="205">&#8722;</text>
    <rect class="box nav" x="370" y="142" width="160" height="58" rx="11"/><text class="t sm" x="450" y="166" text-anchor="middle">PI controller</text><text class="s" x="450" y="184" text-anchor="middle">Kp 0.01 · Ki 0.04</text>
    <circle cx="600" cy="171" r="20" fill="#fff" stroke="#475569" stroke-width="1.8" filter="url(#sh)"/><text class="s" x="578" y="162">+</text><text class="s" x="606" y="158">+</text>
    <rect class="box estim" x="500" y="40" width="200" height="58" rx="11"/><text class="t sm" x="600" y="64" text-anchor="middle">feedforward</text><text class="s" x="600" y="82" text-anchor="middle">sign·breakaway + k·&#969;*</text>
    <rect class="box infra" x="650" y="142" width="150" height="58" rx="11"/><text class="t sm" x="725" y="166" text-anchor="middle">clamp &#177;100</text><text class="s" x="725" y="184" text-anchor="middle">+ motor polarity</text>
    <rect class="box fw" x="835" y="142" width="180" height="58" rx="11"/><text class="t sm" x="925" y="166" text-anchor="middle">PWM 21 kHz + DIR</text><text class="s" x="925" y="184" text-anchor="middle">H-bridge</text>
    <rect class="box infra" x="1050" y="142" width="190" height="58" rx="11"/><text class="t sm" x="1145" y="166" text-anchor="middle">DC motor + gearbox</text><text class="s" x="1145" y="184" text-anchor="middle">&#8776;11 rad/s @ full duty</text>
    <rect class="box percep" x="640" y="290" width="210" height="58" rx="11"/><text class="t sm" x="745" y="314" text-anchor="middle">Encoder · PCNT 4&#215;</text><text class="s" x="745" y="332" text-anchor="middle">5756 ticks/rev</text>

    <path class="edge" d="M55,171 H120"/><text class="elabel" x="78" y="162">&#969;*</text>
    <path class="edge" d="M270,171 H300"/>
    <path class="edge" d="M340,171 H370"/><text class="elabel" x="355" y="163">e</text>
    <path class="edge" d="M530,171 H580"/>
    <path class="edge" d="M620,171 H650"/>
    <path class="edge" d="M800,171 H835"/><text class="elabel" x="817" y="163">duty</text>
    <path class="edge" d="M1015,171 H1050"/>
    <path class="edge" d="M1240,171 H1330"/><text class="elabel" x="1318" y="162">&#969;</text>
    <path class="edge" d="M600,98 V151"/>
    <circle cx="1280" cy="171" r="3" fill="#475569"/>
    <path class="edge" d="M1280,171 V319 H850"/>
    <path class="edge" d="M640,319 H320 V191"/><text class="elabel" x="470" y="312">measured &#969;</text>

    <text class="t sm" x="120" y="384" font-weight="500" fill="#64748b">&#969;* = 0 &#8594; active braking (releases below 0.33 rad/s)&#160;&#160;&#183;&#160;&#160;link_up = false &#8594; duty forced to 0</text>
  
</svg>
