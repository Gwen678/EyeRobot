    <rect class="box nav" x="640" y="90"  width="220" height="70" rx="13"/><text class="t sm" x="750" y="120" text-anchor="middle">planner_server</text><text class="s" x="750" y="139" text-anchor="middle">global path</text>
    <rect class="box infra" x="940" y="90" width="240" height="70" rx="13"/><text class="t sm" x="1060" y="120" text-anchor="middle">global_costmap</text><text class="s" x="1060" y="139" text-anchor="middle">static+inflation</text>

    <rect class="box nav" x="330" y="210" width="240" height="70" rx="13"/><text class="t sm" x="450" y="240" text-anchor="middle">behavior_server</text><text class="s" x="450" y="259" text-anchor="middle">spin·backup·wait</text>
    <rect class="box nav" x="640" y="210" width="220" height="70" rx="13"/><text class="t sm" x="750" y="240" text-anchor="middle">controller_server</text><text class="s" x="750" y="259" text-anchor="middle">DWB local control</text>
