<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1480 700">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <line x1="700" y1="40" x2="700" y2="660" stroke="#e2e8f0" stroke-width="1.5"/>
    <text class="grouplbl" x="60" y="60">SENSOR FUSION</text>
    <text class="grouplbl" x="760" y="60">TF TREE</text>

    <rect class="box sensor" x="40" y="110" width="180" height="60" rx="11"/><text class="t sm" x="130" y="136" text-anchor="middle">Wheel encoders</text><text class="s" x="130" y="154" text-anchor="middle">5756 ticks/rev</text>
    <rect class="box sensor" x="40" y="270" width="180" height="60" rx="11"/><text class="t sm" x="130" y="296" text-anchor="middle">OAK-D IMU</text><text class="s" x="130" y="314" text-anchor="middle">BMI270 6-axis</text>
    <rect class="box sensor" x="40" y="470" width="180" height="60" rx="11"/><text class="t sm" x="130" y="496" text-anchor="middle">RPLidar A1M8</text><text class="s" x="130" y="514" text-anchor="middle">/scan</text>

    <rect class="box infra"  x="280" y="110" width="170" height="60" rx="11"/><text class="t sm" x="365" y="136" text-anchor="middle">diff_drive_controller</text><text class="s" x="365" y="154" text-anchor="middle">/odom</text>
    <rect class="box percep" x="280" y="270" width="170" height="56" rx="11"/><text class="t sm" x="365" y="294" text-anchor="middle">imu_remap</text><text class="s" x="365" y="311" text-anchor="middle">tilt+bias</text>
    <rect class="box percep" x="280" y="356" width="170" height="56" rx="11"/><text class="t sm" x="365" y="380" text-anchor="middle">imu_filter_madgwick</text><text class="s" x="365" y="397" text-anchor="middle">/oak/imu/fused</text>

    <rect class="box estim" x="500" y="150" width="170" height="150" rx="14"/><text class="t" x="585" y="198" text-anchor="middle">EKF</text><text class="s" x="585" y="220" text-anchor="middle">ekf_filter_node</text><text class="s" x="585" y="246" text-anchor="middle">→ /odometry/filtered</text><text class="s" x="585" y="264" text-anchor="middle">→ odom→base_link</text>
    <rect class="box estim" x="500" y="455" width="170" height="90" rx="14"/><text class="t sm" x="585" y="493" text-anchor="middle">AMCL</text><text class="s" x="585" y="513" text-anchor="middle">particle filter</text><text class="s" x="585" y="531" text-anchor="middle">→ map→odom</text>

    <path class="edge" d="M220,140 H280"/>
    <path class="edge" d="M220,300 H280 V298"/>
    <path class="edge" d="M365,326 V356"/><text class="elabel" x="420" y="345">data_raw</text>
    <path class="edge" d="M450,140 H480 V190 H500"/><text class="elabel" x="490" y="183">vx</text>
    <path class="edge" d="M450,384 H480 V260 H500"/><text class="elabel" x="490" y="345">vyaw</text>
    <path class="edge" d="M220,500 H500"/><text class="elabel" x="360" y="492">/scan</text>

    <rect class="box tf" x="993" y="90"  width="180" height="54" rx="11"/><text class="t sm" x="1083" y="123" text-anchor="middle">map</text>
    <rect class="box tf" x="993" y="220" width="180" height="54" rx="11"/><text class="t sm" x="1083" y="253" text-anchor="middle">odom</text>
    <rect class="box tf" x="993" y="350" width="180" height="54" rx="11"/><text class="t sm" x="1083" y="383" text-anchor="middle">base_link</text>
    <rect class="box infra" x="740" y="490" width="150" height="52" rx="10"/><text class="t sm" x="815" y="520" text-anchor="middle">laser</text>
    <rect class="box infra" x="910" y="490" width="165" height="52" rx="10"/><text class="t sm" x="992" y="520" text-anchor="middle">oak_mount</text>
    <rect class="box infra" x="1095" y="490" width="140" height="52" rx="10"/><text class="t sm" x="1165" y="520" text-anchor="middle">imu_link</text>
    <rect class="box infra" x="1255" y="490" width="195" height="52" rx="10"/><text class="t sm" x="1352" y="513" text-anchor="middle">left_wheel_link</text><text class="s" x="1352" y="531" text-anchor="middle">right_wheel_link</text>

    <path class="edge tf" d="M1083,144 V220"/><text class="elabel" x="1083" y="186">AMCL</text>
    <path class="edge tf" d="M1083,274 V350"/><text class="elabel" x="1083" y="316">EKF</text>
    <path class="edge tf plain" d="M1083,404 V448"/>
    <path class="edge tf plain" d="M815,448 H1352"/>
    <path class="edge tf" d="M815,448 V490"/>
    <path class="edge tf" d="M992,448 V490"/>
    <path class="edge tf" d="M1165,448 V490"/>
    <path class="edge tf" d="M1352,448 V490"/>
    <text class="elabel" x="900" y="442">robot_state_publisher / imu_remap</text>
  
</svg>
