<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1380 620">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <rect class="box sensor"  x="40"  y="120" width="180" height="90" rx="13"/>
    <text class="t sm" x="130" y="158" text-anchor="middle">Sensing</text>
    <text class="s" x="130" y="178" text-anchor="middle">cam·LIDAR</text>
    <text class="s" x="130" y="194" text-anchor="middle">enc·IMU</text>

    <rect class="box percep" x="280" y="70" width="200" height="70" rx="13"/>
    <text class="t" x="380" y="100" text-anchor="middle">Perception</text>
    <text class="s lg" x="380" y="122" text-anchor="middle">bricks · obstacles</text>

    <rect class="box estim" x="280" y="180" width="200" height="70" rx="13"/>
    <text class="t" x="380" y="210" text-anchor="middle">Localisation</text>
    <text class="s lg" x="380" y="232" text-anchor="middle">pose · map</text>

    <rect class="box nav" x="560" y="110" width="210" height="80" rx="14"/>
    <text class="t" x="665" y="143" text-anchor="middle">Planning &amp;</text>
    <text class="t" x="665" y="163" text-anchor="middle">Navigation</text>

    <rect class="box mission" x="840" y="110" width="200" height="80" rx="14"/>
    <text class="t" x="940" y="143" text-anchor="middle">Motion</text>
    <text class="t" x="940" y="163" text-anchor="middle">Control</text>

    <rect class="box fw" x="560" y="330" width="170" height="72" rx="13"/>
    <text class="t sm" x="645" y="360" text-anchor="middle">Collection</text>
    <text class="s" x="645" y="379" text-anchor="middle">fan intake</text>
    <rect class="box fw" x="790" y="330" width="170" height="72" rx="13"/>
    <text class="t sm" x="875" y="360" text-anchor="middle">Storage</text>
    <text class="s" x="875" y="379" text-anchor="middle">conveyor</text>
    <rect class="box fw" x="1020" y="330" width="170" height="72" rx="13"/>
    <text class="t sm" x="1105" y="360" text-anchor="middle">Delivery</text>
    <text class="s" x="1105" y="379" text-anchor="middle">reverse belt+fans</text>

    <rect class="box infra" x="280" y="470" width="910" height="50" rx="12"/>
    <text class="t sm" x="735" y="501" text-anchor="middle">Compute &amp; Middleware — Jetson Nano · ROS 2 Humble (Docker) · ESP32 micro-ROS</text>
    <rect class="box power" x="280" y="540" width="910" height="46" rx="12"/>
    <text class="t sm" x="735" y="569" text-anchor="middle">Power — battery (VBAT) · regulated 5 V rails</text>

    <path class="edge" d="M220,140 H245 V105 H280"/>
    <path class="edge" d="M220,190 H245 V215 H280"/>
    <path class="edge" d="M480,105 H520 V135 H560"/><text class="elabel" x="520" y="98">detections</text>
    <path class="edge" d="M480,215 H520 V165 H560"/><text class="elabel" x="520" y="228">pose</text>
    <path class="edge" d="M770,150 H840"/><text class="elabel" x="805" y="142">velocity</text>
    <path class="edge" d="M620,190 V300 H645 V330"/><text class="elabel" x="636" y="296">targets</text>
    <path class="edge" d="M940,190 V300 H875 V330"/><text class="elabel" x="940" y="262">actuation</text>
    <path class="edge" d="M730,366 H790"/>
    <path class="edge" d="M960,366 H1020"/>
    <path class="edge dash" d="M940,110 V40 H260 V230 H280"/><text class="elabel dim" x="600" y="33">odometry feedback</text>
  
</svg>
