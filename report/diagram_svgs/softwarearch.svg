    <path class="edge tf" d="M1170,726 H1215 V470 H1230"/><text class="elabel" x="1245" y="560">map→odom</text>

    <path class="edge bidir blue" d="M1530,405 H1485 V445 H1440"/><text class="elabel" x="1495" y="398">goal</text>
    <path class="edge green" d="M730,542 V830 H1480 V430 H1530"/><text class="elabel" x="1050" y="822">lego_markers_map</text>
    <path class="edge" d="M1630,450 V540"/><text class="elabel" x="1630" y="498">fans/belt</text>

