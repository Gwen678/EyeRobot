<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1760 1100">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <text class="lanelabel" x="140" y="28" text-anchor="middle">Hardware</text>
    <text class="lanelabel" x="420" y="28" text-anchor="middle">Drivers</text>
    <text class="lanelabel" x="790" y="28" text-anchor="middle">Processing</text>
    <text class="lanelabel" x="1075" y="28" text-anchor="middle">Estimation</text>
    <text class="lanelabel" x="1335" y="28" text-anchor="middle">Navigation</text>
    <text class="lanelabel" x="1630" y="28" text-anchor="middle">Mission</text>

    <rect class="box fw"     x="40"  y="110" width="200" height="72" rx="12"/><text class="t sm" x="140" y="140" text-anchor="middle">ESP32 firmware</text><text class="s" x="140" y="160" text-anchor="middle">5 motors · 2 enc</text>
    <rect class="box sensor" x="40"  y="340" width="200" height="72" rx="12"/><text class="t sm" x="140" y="370" text-anchor="middle">OAK-D Lite</text><text class="s" x="140" y="390" text-anchor="middle">RGB·depth·IMU</text>
    <rect class="box sensor" x="40"  y="690" width="200" height="72" rx="12"/><text class="t sm" x="140" y="720" text-anchor="middle">RPLidar A1M8</text><text class="s" x="140" y="740" text-anchor="middle">360° scan</text>

    <rect class="box driver" x="320" y="113" width="200" height="66" rx="12"/><text class="t sm" x="420" y="140" text-anchor="middle">micro_ros_agent</text><text class="s" x="420" y="160" text-anchor="middle">/dev/esp32</text>
    <rect class="box driver" x="320" y="343" width="200" height="66" rx="12"/><text class="t sm" x="420" y="370" text-anchor="middle">depthai_ros_driver</text><text class="s" x="420" y="390" text-anchor="middle">/oak/*</text>
    <rect class="box driver" x="320" y="693" width="200" height="66" rx="12"/><text class="t sm" x="420" y="720" text-anchor="middle">rplidar_node</text><text class="s" x="420" y="740" text-anchor="middle">/scan</text>

    <rect class="box infra"  x="600" y="100" width="240" height="92" rx="13"/><text class="t sm" x="720" y="130" text-anchor="middle">controller_manager</text><text class="s" x="720" y="150" text-anchor="middle">eyerobot_hardware</text><text class="s" x="720" y="168" text-anchor="middle">diff_drive_controller</text>
    <rect class="box percep" x="600" y="344" width="160" height="64" rx="11"/><text class="t sm" x="680" y="372" text-anchor="middle">imu_remap</text><text class="s" x="680" y="390" text-anchor="middle">tilt+bias</text>
    <rect class="box percep" x="820" y="344" width="160" height="64" rx="11"/><text class="t sm" x="900" y="372" text-anchor="middle">imu_filter_madgwick</text><text class="s" x="900" y="390" text-anchor="middle">orientation</text>
    <rect class="box percep" x="600" y="470" width="260" height="72" rx="12"/><text class="t sm" x="730" y="500" text-anchor="middle">lego_vision_node</text><text class="s" x="730" y="520" text-anchor="middle">/ yolo_vision_node</text>

    <rect class="box estim"  x="980" y="200" width="190" height="100" rx="13"/><text class="t" x="1075" y="240" text-anchor="middle">EKF</text><text class="s" x="1075" y="262" text-anchor="middle">ekf_filter_node</text><text class="s" x="1075" y="280" text-anchor="middle">vx + vyaw</text>
    <rect class="box estim"  x="980" y="600" width="190" height="60" rx="11"/><text class="t sm" x="1075" y="627" text-anchor="middle">map_server</text><text class="s" x="1075" y="645" text-anchor="middle">/map</text>
    <rect class="box estim"  x="980" y="693" width="190" height="66" rx="11"/><text class="t sm" x="1075" y="721" text-anchor="middle">AMCL</text><text class="s" x="1075" y="739" text-anchor="middle">map→odom</text>

    <rect class="box nav"    x="1230" y="360" width="210" height="170" rx="14"/><text class="t" x="1335" y="402" text-anchor="middle">Nav2 stack</text><text class="s" x="1335" y="426" text-anchor="middle">bt_navigator</text><text class="s" x="1335" y="444" text-anchor="middle">planner · DWB</text><text class="s" x="1335" y="462" text-anchor="middle">costmaps</text><text class="s" x="1335" y="480" text-anchor="middle">recoveries</text>

    <rect class="box mission" x="1530" y="360" width="200" height="90" rx="13"/><text class="t sm" x="1630" y="392" text-anchor="middle">behavior_tree</text><text class="s" x="1630" y="412" text-anchor="middle">py_trees</text><text class="s" x="1630" y="430" text-anchor="middle">mission loop</text>
    <rect class="box mission" x="1530" y="540" width="200" height="72" rx="12"/><text class="t sm" x="1630" y="570" text-anchor="middle">cmd_vel_bridge</text><text class="s" x="1630" y="590" text-anchor="middle">fans + belt</text>
    <rect class="box infra"   x="1530" y="720" width="200" height="72" rx="12"/><text class="t sm" x="1630" y="750" text-anchor="middle">foxglove_bridge</text><text class="s" x="1630" y="770" text-anchor="middle">WebSocket :8765</text>

    <path class="edge bidir" d="M240,146 H320"/><text class="elabel" x="280" y="139">micro-ROS</text>
