<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1230 600">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <rect class="box power" x="60" y="210" width="210" height="90" rx="13"/><text class="t sm" x="165" y="248" text-anchor="middle">Battery</text><text class="s" x="165" y="268" text-anchor="middle">VBAT</text><text class="s" x="165" y="286" text-anchor="middle">on-board</text>
    <rect class="box power" x="60" y="350" width="210" height="60" rx="11"/><text class="t sm" x="165" y="375" text-anchor="middle">5 V regulator / buck</text><text class="s" x="165" y="394" text-anchor="middle">— logic</text>
    <rect class="box power" x="60" y="460" width="210" height="60" rx="11"/><text class="t sm" x="165" y="485" text-anchor="middle">5 V regulator / buck</text><text class="s" x="165" y="504" text-anchor="middle">— Jetson</text>

    <rect class="box fw" x="310" y="250" width="230" height="150" rx="13"/><text class="t" x="425" y="290" text-anchor="middle">ESP32</text><text class="s" x="425" y="314" text-anchor="middle">5× PWM + DIR outputs</text><text class="s" x="425" y="334" text-anchor="middle">2× encoder inputs</text><text class="s" x="425" y="354" text-anchor="middle">UART / micro-ROS to Jetson</text>

    <rect class="box power" x="610" y="90" width="260" height="90" rx="13"/><text class="t sm" x="740" y="125" text-anchor="middle">Motor drivers / power stage</text><text class="s" x="740" y="147" text-anchor="middle">5 PWM+DIR channels</text>

    <rect class="box infra" x="910" y="55"  width="260" height="52" rx="10"/><text class="t sm" x="1040" y="78" text-anchor="middle">Left drive motor + enc</text><text class="s" x="1040" y="96" text-anchor="middle">LEFT_WHEEL</text>
    <rect class="box infra" x="910" y="120" width="260" height="52" rx="10"/><text class="t sm" x="1040" y="143" text-anchor="middle">Right drive motor + enc</text><text class="s" x="1040" y="161" text-anchor="middle">RIGHT_WHEEL</text>
    <rect class="box infra" x="910" y="185" width="260" height="48" rx="10"/><text class="t sm" x="1040" y="206" text-anchor="middle">Belt motor</text><text class="s" x="1040" y="223" text-anchor="middle">BELT</text>
    <rect class="box infra" x="910" y="246" width="260" height="48" rx="10"/><text class="t sm" x="1040" y="267" text-anchor="middle">Fan motors ×2</text><text class="s" x="1040" y="284" text-anchor="middle">LEFT_FAN · RIGHT_FAN</text>

    <rect class="box infra" x="610" y="400" width="250" height="140" rx="14"/><text class="t" x="735" y="440" text-anchor="middle">Jetson Nano</text><text class="s" x="735" y="462" text-anchor="middle">ROS 2 Docker host</text><text class="s" x="735" y="480" text-anchor="middle">5 V dedicated supply</text><text class="s" x="735" y="498" text-anchor="middle">USB host</text>

    <rect class="box sensor" x="1000" y="410" width="180" height="52" rx="11"/><text class="t sm" x="1090" y="440" text-anchor="middle">OAK-D Lite</text>
    <rect class="box sensor" x="1000" y="488" width="180" height="52" rx="11"/><text class="t sm" x="1090" y="518" text-anchor="middle">RPLidar A1M8</text>

    <!-- VBAT power (red) -->
    <path class="edge red" d="M165,210 V135 H610"/><text class="elabel" x="385" y="128">VBAT</text>
    <path class="edge red plain" d="M60,255 H30 V490"/>
    <path class="edge red" d="M30,380 H60"/><path class="edge red" d="M30,490 H60"/><text class="elabel" x="40" y="335">VBAT</text>
    <!-- motor power (red), drivers -> motors -->
    <path class="edge red plain" d="M870,135 H892"/>
    <path class="edge red plain" d="M892,81 V270"/>
    <path class="edge red" d="M892,81 H910"/><path class="edge red" d="M892,146 H910"/><path class="edge red" d="M892,209 H910"/><path class="edge red" d="M892,270 H910"/>
    <text class="elabel" x="892" y="44">motor power</text>

    <!-- 5 V power (green), source -> load -->
    <path class="edge green" d="M270,380 H290 V325 H310"/><text class="elabel" x="283" y="318">5 V</text>
    <path class="edge green" d="M270,490 H580 V470 H610"/><text class="elabel" x="410" y="482">5 V</text>

    <!-- control (grey): PWM+DIR out, encoder feedback in -->
    <path class="edge" d="M410,250 V205 H700 V180"/><text class="elabel" x="540" y="215">5× PWM + DIR</text>
    <path class="edge plain" d="M1170,81 H1190"/><path class="edge plain" d="M1170,146 H1190"/><path class="edge plain" d="M1190,81 V146"/>
    <path class="edge" d="M1190,113 V340 H560 V325 H540"/><text class="elabel" x="840" y="332">2× encoder A/B feedback</text>

    <!-- UART (grey, bidirectional) -->
    <path class="edge bidir" d="M420,400 V430 H610"/><text class="elabel" x="480" y="423">UART micro-ROS</text>

    <!-- USB (blue, bidirectional) -->
    <path class="edge blue bidir" d="M860,436 H1000"/><text class="elabel" x="930" y="428">USB data + power</text>
    <path class="edge blue bidir" d="M860,500 H930 V514 H1000"/><text class="elabel" x="920" y="490">USB data + power</text>
  
</svg>
