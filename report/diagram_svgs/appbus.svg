<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1300 470">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <rect class="box fw" x="60" y="150" width="240" height="170" rx="13"/><text class="t" x="180" y="192" text-anchor="middle">MicroRosTask</text><text class="s" x="180" y="216" text-anchor="middle">FreeRTOS task</text><text class="s" x="180" y="244" text-anchor="middle">writes to_motor[id]</text><text class="s" x="180" y="264" text-anchor="middle">reads from_motor[id]</text><text class="s" x="180" y="284" text-anchor="middle">owns link_up</text>

    <rect class="group" x="380" y="62" width="410" height="392" rx="16"/><text class="grouplbl" x="400" y="86">AppBus — lock-free channels (one pair per MotorID)</text>
    <rect class="box infra" x="420" y="100" width="330" height="66" rx="11"/><text class="t sm" x="585" y="128" text-anchor="middle">to_motor[id] · Channel&lt;MotorCmd&gt;</text><text class="s" x="585" y="148" text-anchor="middle">writer MicroRosTask · reader MotorTask</text>
    <rect class="box infra" x="420" y="200" width="330" height="66" rx="11"/><text class="t sm" x="585" y="228" text-anchor="middle">from_motor[id] · Channel&lt;MotorFeedback&gt;</text><text class="s" x="585" y="248" text-anchor="middle">writer MotorTask · reader MicroRosTask</text>
    <rect class="box infra" x="420" y="300" width="330" height="58" rx="11"/><text class="t sm" x="585" y="324" text-anchor="middle">link_up · shared flag</text><text class="s" x="585" y="344" text-anchor="middle">false → all motors gated to 0</text>

    <rect class="box fw" x="870" y="150" width="240" height="170" rx="13"/><text class="t" x="990" y="192" text-anchor="middle">MotorTask[id]</text><text class="s" x="990" y="216" text-anchor="middle">FreeRTOS task · ×5</text><text class="s" x="990" y="244" text-anchor="middle">reads to_motor[id]</text><text class="s" x="990" y="264" text-anchor="middle">writes from_motor[id]</text><text class="s" x="990" y="284" text-anchor="middle">checks link_up</text>

    <path class="edge" d="M300,133 H420"/><text class="elabel" x="360" y="126">send / sendLatest</text>
    <path class="edge" d="M750,133 H810 V200 H870"/><text class="elabel" x="838" y="170">receiveLatest</text>
    <path class="edge" d="M870,255 H810 V233 H750"/><text class="elabel" x="838" y="276">send</text>
    <path class="edge" d="M420,233 H360 V270 H300"/><text class="elabel" x="350" y="262">receive</text>
    <path class="edge" d="M300,300 H400 V329 H420"/>
    <path class="edge" d="M750,329 H810 V300 H870"/><text class="elabel" x="812" y="322">hard gate</text>

    <text class="grouplbl" x="60" y="404" fill="#64748b">THREAD SAFETY</text>
    <text class="t sm" x="60" y="428" font-weight="500">Each Channel is a FreeRTOS queue with one writer and one reader, so no mutex is needed.</text>
    <text class="t sm" x="60" y="448" font-weight="500">sendLatest / receiveLatest keep the newest command, so a stop is never queued behind older moves.</text>
  
</svg>
