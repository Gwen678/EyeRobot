<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 800">
<style>
  text{font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif}
  .t{font:700 15px "Inter","Segoe UI",Arial,sans-serif;fill:#0f172a}
  .t.sm{font-size:13px}
  .s{font:600 11px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#64748b}
  .s.lg{font-size:12px}
  .lanelabel{font:800 12px "Inter",Arial,sans-serif;fill:#94a3b8;letter-spacing:.13em;text-transform:uppercase}
  .elabel{font:600 11.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
  .elabel.dim{fill:#64748b}
  .group{fill:none;stroke:#cbd5e1;stroke-dasharray:5 4;}
  .grouplbl{font:800 12px "Inter",Arial,sans-serif;fill:#64748b;letter-spacing:.06em}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#ar)}
  .edge.blue{stroke:#3b82f6;marker-end:url(#arb)}
  .edge.red{stroke:#ef4444;marker-end:url(#arr)}
  .edge.tf{stroke:#6366f1;stroke-width:2.2;marker-end:url(#ari)}
  .edge.green{stroke:#10b981;marker-end:url(#arg)}
  .edge.dash{stroke-dasharray:6 5}
  .edge.bidir{marker-start:url(#arrev)}
  .edge.blue.bidir{marker-start:url(#arbrev)}
  .edge.plain{marker-end:none}
  .box{filter:url(#sh)}
  .sensor {fill:#fffbeb;stroke:#d97706;stroke-width:1.7}
  .driver {fill:#f0f9ff;stroke:#0284c7;stroke-width:1.7}
  .percep {fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.7}
  .estim  {fill:#f0fdfa;stroke:#0d9488;stroke-width:1.7}
  .nav    {fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}
  .mission{fill:#ecfdf5;stroke:#059669;stroke-width:1.7}
  .fw     {fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}
  .power  {fill:#fef2f2;stroke:#dc2626;stroke-width:1.7}
  .infra  {fill:#f8fafc;stroke:#475569;stroke-width:1.7}
  .tf     {fill:#eef2ff;stroke:#4f46e5;stroke-width:1.7}
</style>
<defs>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="arrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/></marker>
  <marker id="arb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b82f6"/></marker>
  <marker id="arbrev" markerWidth="11" markerHeight="11" refX="0.5" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#3b82f6"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ef4444"/></marker>
  <marker id="ari" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6366f1"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
</defs>

    <rect class="box driver" x="40" y="330" width="180" height="90" rx="13"/><text class="t sm" x="130" y="362" text-anchor="middle">Host (Jetson)</text><text class="s" x="130" y="382" text-anchor="middle">micro_ros_agent</text><text class="s" x="130" y="400" text-anchor="middle">UART 115200</text>

    <rect class="box fw" x="290" y="300" width="250" height="150" rx="14"/><text class="t" x="415" y="334" text-anchor="middle">MicroRosTask</text><text class="s" x="415" y="356" text-anchor="middle">5 cmd subscribers</text><text class="s" x="415" y="374" text-anchor="middle">5 tick + 5 speed pubs</text><text class="s" x="415" y="392" text-anchor="middle">sets link_up · gating</text><text class="s" x="415" y="410" text-anchor="middle">single-attempt reconnect</text>

    <rect class="box infra" x="600" y="300" width="130" height="160" rx="14"/><text class="t sm" x="665" y="368" text-anchor="middle">AppBus</text><text class="s" x="665" y="390" text-anchor="middle">to_motor[5]</text><text class="s" x="665" y="408" text-anchor="middle">from_motor[5]</text><text class="s" x="665" y="426" text-anchor="middle">link_up</text>

    <rect class="box fw" x="840" y="80"  width="260" height="76" rx="13"/><text class="t sm" x="970" y="110" text-anchor="middle">RIGHT_WHEEL</text><text class="s" x="970" y="130" text-anchor="middle">PI + encoder (PCNT)</text>
    <rect class="box fw" x="840" y="176" width="260" height="76" rx="13"/><text class="t sm" x="970" y="206" text-anchor="middle">LEFT_WHEEL</text><text class="s" x="970" y="226" text-anchor="middle">PI + encoder (PCNT)</text>
    <rect class="box fw" x="840" y="300" width="260" height="60" rx="13"/><text class="t sm" x="970" y="335" text-anchor="middle">BELT — open-loop</text>
    <rect class="box fw" x="840" y="388" width="260" height="60" rx="13"/><text class="t sm" x="970" y="423" text-anchor="middle">LEFT_FAN — open-loop</text>
    <rect class="box fw" x="840" y="476" width="260" height="60" rx="13"/><text class="t sm" x="970" y="511" text-anchor="middle">RIGHT_FAN — open-loop</text>

    <rect class="box power" x="1180" y="300" width="240" height="120" rx="14"/><text class="t sm" x="1300" y="345" text-anchor="middle">MotorController</text><text class="s" x="1300" y="365" text-anchor="middle">+ H-bridge</text><text class="s" x="1300" y="383" text-anchor="middle">LEDC PWM 21 kHz</text>

    <path class="edge bidir" d="M220,375 H290"/><text class="elabel" x="238" y="367">serial</text>
    <path class="edge bidir" d="M540,375 H600"/>

    <path class="edge plain" d="M730,380 H780"/>
    <path class="edge plain" d="M780,118 V506"/>
    <path class="edge" d="M780,118 H840"/>
    <path class="edge" d="M780,214 H840"/>
    <path class="edge" d="M780,330 H840"/>
    <path class="edge" d="M780,418 H840"/>
    <path class="edge" d="M780,506 H840"/>
    <text class="elabel" x="762" y="270">cmd / fb</text>

    <path class="edge plain" d="M1100,118 H1140"/>
    <path class="edge plain" d="M1100,214 H1140"/>
    <path class="edge plain" d="M1140,118 V360"/>
    <path class="edge" d="M1140,360 H1180"/>
    <text class="elabel" x="1158" y="300">PWM / duty</text>

    <path class="edge" d="M1420,360 H1470"/><text class="elabel" x="1448" y="352">motors</text>

    <rect x="40" y="600" width="1420" height="150" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
    <text class="t" x="64" y="632" fill="#be123c">Safety logic — robot defaults to STOPPED under any fault</text>
    <text class="t sm" x="64" y="662" fill="#9f1239" font-weight="500">• Startup: every motor control line forced to PWM 0 / DIR low before any task or comms entity is created.</text>
    <text class="t sm" x="64" y="690" fill="#9f1239" font-weight="500">• Link gating: motors hard-gated to 0 whenever the micro-ROS link is down (boot or reconnect).</text>
    <text class="t sm" x="64" y="718" fill="#9f1239" font-weight="500">• Watchdog: any motor command not refreshed within 500 ms is zeroed (comms-loss stop, with active braking).</text>
  
</svg>
