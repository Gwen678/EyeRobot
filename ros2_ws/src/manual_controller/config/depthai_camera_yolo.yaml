# depthai_camera.yaml variant with onboard YOLOv8 block detection enabled.
# Enables spatial YOLO on the VPU; keep all other values in sync with depthai_camera.yaml.

/**:
  ros__parameters:

    camera:
      i_pipeline_type: "RGBD"
      i_enable_imu: true
      i_nn_type: "spatial"      # onboard YOLO + spatial (depth) association

    nn:
      # Generated by lego_test.launch.py at launch: YOLO, 1 class "block",
      # conf 0.7, iou 0.5, blob from the perception package install space.
      i_nn_config_path: "/tmp/eyerobot_yolo_nn.json"
      i_enable_passthrough: false
      # Preview size must match the blob input exactly or the driver aborts.
      # i_preview_* values are placeholders; lego_test.launch.py rewrites them.
      i_disable_resize: true
      # Publishes NN input frames on /oak/nn/passthrough for diagnostics.
      # Set back to false once the mirrored bbox/spatial issue is resolved.
      i_enable_passthrough: true

    rgb:
      i_publish_topic: true
      i_fps: 5.0
      i_width: 640
      i_height: 480
      i_preview_size: 640       # older driver API (square preview)
      i_preview_width: 640      # newer driver API, both kept in sync
      i_preview_height: 640

    stereo:
      i_publish_topic: true
      i_fps: 5.0
      i_align_depth: true

    imu:
      i_acc_freq: 50
      i_gyro_freq: 50
      i_message_type: "IMU"
      i_publish_topic: true
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
      i_sync_method: "COPY"     # mandatory on driver 2.7.0-2.7.4, see depthai_camera.yaml
      i_get_base_device_timestamp: false
      i_update_ros_base_time_on_ros_msg: true
