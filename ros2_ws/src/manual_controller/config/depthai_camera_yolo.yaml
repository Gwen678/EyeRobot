# depthai_camera.yaml variant with the onboard YOLOv8 block detector enabled.
# Used by lego_test.launch.py detector:=yolo (and usable in the full stack the
# same way). Differences from depthai_camera.yaml:
#   - camera.i_nn_type: "spatial" — the driver builds a
#     YoloSpatialDetectionNetwork on the OAK's Myriad X VPU: detection AND
#     depth lookup happen on-device, the host only receives small
#     vision_msgs/Detection3DArray messages on /oak/nn/spatial_detections.
#   - nn.i_nn_config_path points at a JSON generated at launch time by
#     lego_test.launch.py (blob path resolved from the installed perception
#     package — share/perception/models/best.blob).
#   - rgb.i_preview_size: 416 — the NN input is the 416x416 preview stream;
#     the published 640x480 image_raw is unaffected.
# Everything else must stay in sync with depthai_camera.yaml (see the
# comments there for the WHY of each value, notably i_sync_method COPY).

/**:
  ros__parameters:

    camera:
      i_pipeline_type: "RGBD"
      i_enable_imu: true
      i_nn_type: "spatial"      # onboard YOLO + spatial (depth) association

    nn:
      # Generated by lego_test.launch.py at launch: YOLO family, 1 class
      # ("block"), conf 0.7 (DEPLOY_OAK.md eval sweep), iou 0.5, blob path
      # resolved into the perception package's install space.
      i_nn_config_path: "/tmp/eyerobot_yolo_nn.json"
      i_enable_passthrough: false

    rgb:
      i_publish_topic: true
      i_fps: 5.0
      i_width: 640
      i_height: 480
      i_preview_size: 416       # NN input stream (square, center-cropped)

    stereo:
      i_publish_topic: true
      i_fps: 5.0
      i_align_depth: true

    imu:
      i_acc_freq: 50
      i_gyro_freq: 50
      i_message_type: "IMU"
      i_publish_topic: true
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
      i_sync_method: "COPY"     # MANDATORY on driver 2.7.0-2.7.4, see depthai_camera.yaml
      i_get_base_device_timestamp: false
      i_update_ros_base_time_on_ros_msg: true
