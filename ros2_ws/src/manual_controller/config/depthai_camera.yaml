# depthai_ros_driver camera node parameters for EyeRobot (OAK-D Lite).
# Modified to enable RGBD pipeline (RGB + Depth) for Lego detection.
#
# Pipeline type must be RGBD to publish both RGB and Depth streams.
# The IMU is enabled independently via camera.i_enable_imu.
#
# Values here are tested against depthai_ros_driver 2.7.x (ROS 2 Humble apt).

/**:
  ros__parameters:

    camera:
      i_pipeline_type: "RGBD"   # RGBD enables both RGB and Stereo Depth streams
      i_enable_imu: true
      i_nn_type: "none"         # No neural network — skip default blob download

    # Enable the RGB (Color) stream
    rgb:
      i_publish_topic: true
      i_fps: 10.0          # <--- Réduit la fréquence à 10 images/sec
      i_width: 640         # <--- Force une basse résolution
      i_height: 480
    # Enable the Stereo (Depth) stream
    stereo:
      i_publish_topic: true
      i_fps: 10.0
      i_align_depth: true

    imu:
      i_acc_freq: 200                                  # Hz — matches oak_imu_cube.py --rate 200
      i_gyro_freq: 200
      i_message_type: "IMU"                            # sensor_msgs/Imu
      i_publish_topic: true
      i_batch_report_threshold: 1                      # minimal batching for low latency
      i_max_batch_reports: 10
      # Valid values: COPY, LINEAR_INTERPOLATE_GYRO, LINEAR_INTERPOLATE_ACCEL
      i_sync_method: "LINEAR_INTERPOLATE_ACCEL"
      i_get_base_device_timestamp: false
      # Re-sync the device→ROS time base on every message
      i_update_ros_base_time_on_ros_msg: true
