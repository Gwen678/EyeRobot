# depthai_ros_driver camera node parameters for EyeRobot (OAK-D Lite).
# Pipeline type RGBD is required; a bare DEPTH pipeline kills the container. Tested against depthai_ros_driver 2.7.x.

/**:
  ros__parameters:

    camera:
      i_pipeline_type: "RGBD"   # RGB + StereoDepth streams; IMU is independent
      i_enable_imu: true
      i_nn_type: "none"         # no neural network; skip default blob download

    # RGB stream for lego_vision_node: 5 fps keeps CPU and USB bandwidth free for IMU and lidar.
    # At 0.3 m/s the robot moves ~6 cm between frames, which is enough for block detection.
    rgb:
      i_publish_topic: true
      i_fps: 5.0
      i_width: 640
      i_height: 480

    # Stereo depth aligned to the RGB frame so each RGB pixel maps to the same depth pixel.
    stereo:
      i_publish_topic: true
      i_fps: 5.0
      i_align_depth: true

    imu:
      # 50 Hz gives ~3 IMU samples per EKF cycle, enough for yaw integration.
      # Do not go below 30 Hz or integration gaps appear at fast turns.
      i_acc_freq: 50
      i_gyro_freq: 50
      i_message_type: "IMU"                    # sensor_msgs/Imu
      i_publish_topic: true
      i_batch_report_threshold: 1              # minimal batching for low delay
      i_max_batch_reports: 10
      # Must stay COPY on depthai-ros 2.7.0-2.7.4: LINEAR_INTERPOLATE_* silently drops all IMU
      # output under stereo load with the BMI270. Fixed in 2.7.5 (github issue #330).
      i_sync_method: "COPY"
      i_get_base_device_timestamp: false
      # Re-sync device to ROS time base on every message; with false, IMU stamps drift behind
      # wheel odom stamps and robot_localization discards stale IMU messages.
      i_update_ros_base_time_on_ros_msg: true
