# imu_filter_madgwick parameters for OAK-D Lite BMI270.
# Input: /oak/imu/data (raw accel + gyro); output: /oak/imu/fused (Madgwick orientation).
# Key must be /** because the node runs namespaced; a bare-name key silently fails to load.

/**:
  ros__parameters:

    # Low gain (0.01): no magnetometer so yaw is unobservable from accel; trusts gyro heavily.
    # Equivalent to alpha=0.98 in the old complementary filter.
    gain: 0.01
    zeta: 0.0            # no gyro drift compensation (no magnetometer reference)
    use_mag: false       # BMI270 has no magnetometer

    # Do not publish TF - base_link to imu_link is a static URDF mount.
    # Publishing it here would give imu_link two parents.
    publish_tf: false

    world_frame: "enu"   # East North Up = ROS REP-103 (Z up, X forward)

    remove_gravity_vector: false  # EKF only fuses vyaw, not linear_acceleration
    use_magnetic_field_msg: false

    # Stationary detection thresholds (used for adaptive gain).
    stationary_acc_thr:  0.01    # m/s²
    stationary_gyro_thr: 0.01    # rad/s
