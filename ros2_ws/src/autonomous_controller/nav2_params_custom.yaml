### Nav2 params for EyeRobot — AMCL localization + full navigation stack.
#
# TF tree:
#   map -> odom        (AMCL, from /scan + saved map)
#   odom -> base_link  (EKF, wheel encoder + IMU)
#   base_link -> laser (URDF fixed joint, lidar_mount)
#
# Run with:
#   ros2 launch manual_controller nav2.launch.py map:=<path>/map.yaml

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2          # rot noise from rot motion  — tune if localisation drifts on turns
    alpha2: 0.2          # rot noise from trans motion
    alpha3: 0.2          # trans noise from trans motion — tune if localisation drifts on straight runs
    alpha4: 0.2          # trans noise from rot motion
    alpha5: 0.2          # (omni only)
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    laser_model_type: likelihood_field
    laser_max_range: 10.0         # A1M8 reliable indoor range (spec 12 m; 10 m keeps accuracy adequate for likelihood field)
    laser_min_range: 0.15
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    scan_topic: /scan
    # Default start pose: green marker in ros2_ws/maps/ref.png. Under the
    # current clean_room_8x8.yaml origin, that point is the user-marked start
    # / discharge point 1 m from the red origin in x and image-y.
    set_initial_pose: true
    initial_pose:
      x: 1.005
      y: -0.955
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # overridden by nav2.launch.py map argument

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    # Nano is slow: service/action ack takes longer than the Nav2 defaults.
    # server_timeout: max wait for action-server ack (default 10 s is too short).
    server_timeout: 30.0
    # bt_loop_duration: BT tick period (ms). 67 ms ≈ 15 Hz — aligned to the
    # EKF and controller rate so the whole pipeline runs at the same cadence.
    bt_loop_duration: 67
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      # Velocity floors = the motor deadband: below ~7 wheel-RPM the wheels
      # do not overcome friction, so DWB commanding less stalls the robot in
      # place while Nav2 believes it is moving.
      # 7 RPM * 2pi/60 * 0.06 m wheel radius = 0.044 m/s linear;
      # in-place rotation equivalent: 0.044 * 2 / 0.33 m separation = 0.27 rad/s.
      # Fast profile (2026-06-11): ceilings at the diff_drive limiter cap
      # (12 rad/s wheels = 0.72 m/s / 4.36 rad/s — motors are the real limit
      # beyond ~9 rad/s). FORWARD FLOOR 0.30 m/s = 5 rad/s wheels, which
      # also clears the firmware friction point (duty = 15% breakaway +
      # 0.01/tps -> ~50% duty = ~3.9 rad/s wheels = 0.23 m/s rolling): DWB
      # samples only [0.30, 0.72] forward — it cannot command speeds the
      # friction eats, and it cannot crawl. Expect wider cornering arcs and
      # goal overshoot (absorbed by xy tolerance + the 0.35 m eat radius).
      # Speed floors at 8 rad/s wheels = 0.48 m/s linear / 2.91 rad/s angular
      # (8 * 0.06 m wheel radius = 0.48 m/s; 0.48 / 0.165 m half-track = 2.91 rad/s).
      min_vel_x: 0.48
      max_vel_x: 0.72
      min_vel_theta: -4.36
      max_vel_theta: 4.36
      min_speed_xy: 0.48
      max_speed_xy: 0.72
      min_speed_theta: 2.91
      acc_lim_x: 0.72
      acc_lim_theta: 4.36
      decel_lim_x: -1.5
      decel_lim_theta: -4.36
      vx_samples: 20
      vtheta_samples: 40
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.20, 0.18], [0.20, -0.18], [-0.20, -0.18], [-0.20, 0.18]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 3.0
      publish_frequency: 1.5
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.20, 0.18], [0.20, -0.18], [-0.20, -0.18], [-0.20, 0.18]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Local soft zone tightened (0.30 -> 0.22, 2026-06-12): the inscribed
        # footprint radius is 0.20 m (hard, physical), so 0.22 leaves only a
        # 2 cm cost gradient. The wide 0.30 zone made recovery spins/backups
        # near walls fail their collision check ("Collision Ahead") even when
        # the maneuver was physically fine. Steeper scaling compensates so
        # DWB still prefers clearance when it exists.
        cost_scaling_factor: 5.0
        inflation_radius: 0.22

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 15
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

# bond_timeout 30 s (default 4.0): the Nano's CPU spikes during camera/NN
# warm-up and EKF load starve the bond heartbeats; with the default the
# lifecycle manager declares healthy servers dead and DEACTIVATES the stack
# mid-boot or mid-mission (observed 2026-06-11: bt_navigator rejecting all
# goals after a load spike). 30 s rides out any realistic spike — a server
# that is genuinely dead for 30 s has crashed visibly anyway.
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 30.0
    node_names: ["map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 30.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "waypoint_follower"]
